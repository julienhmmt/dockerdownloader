# golangci-lint v2 configuration for dockerdownloader.
# Run locally with: make go-lint  (builds the pinned golangci-lint with go1.27.3)
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errorlint
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errorlint:
      # Flag fmt.Errorf without %w when wrapping an error.
      errorf: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/julienhmmt/dockerdownloader

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
