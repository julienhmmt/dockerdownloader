# Example image list for dockerdownloader.
#
#   dockerdownloader                              # TUI, reads images_file from config
#   dockerdownloader batch images.yaml            # headless, all settings from config
#   dockerdownloader -images images.yaml          # TUI with an explicit list
#
# Every other setting (registry prefix, output dir, platform, concurrency,
# compression, proxy, resume, …) is read from the config file; see
# config.example.yaml.
#
# References are validated before anything is pulled: an entry that is not a
# parseable image reference aborts the run. Docker Hub shorthand is expanded
# for you ("redis:7" → docker.io/library/redis:7), and duplicate entries (by
# canonical reference) are collapsed.
images:
  - nginx:1.27
  - quay.io/argoproj/argocd:v3.2.6
  - docker.io/library/redis:7.2
  # Digest-pinned references are accepted, and the digest must exist on the
  # registry or the pull fails with MANIFEST_UNKNOWN. Note the destination is
  # always a tag, because a docker-archive tarball cannot be tagged by digest:
  # this mirrors to <prefix>/docker.io/library/postgres:latest.
  # The digest below is the multi-arch index for postgres:17 (linux/amd64 is
  # resolved from it at pull time).
  - docker.io/library/postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
