# SonarQube project: dockerdownloader (Go module at repo root)
sonar.projectKey=dockerdownloader
sonar.projectName=dockerdownloader (Go)

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/vendor/**,**/dist/**,**/plans/**,**/graphify-out/**,**/coverage.out,dockerdownloader

sonar.go.coverage.reportPaths=.sonar/server-coverage.out
sonar.coverage.exclusions=**/*_test.go

sonar.sourceEncoding=UTF-8
